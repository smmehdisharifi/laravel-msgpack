name: Run Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            testbench: '^7.0'
          - php: '8.2'
            testbench: '^8.0'
          - php: '8.3'
            testbench: '^9.0'
          - php: '8.4'
            testbench: '^10.0'

    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-composer-${{ matrix.testbench }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        # Older Laravel lines are required for this compatibility matrix and are flagged by Composer's security policy.
        run: composer update --prefer-dist --no-progress --no-interaction --no-security-blocking --no-audit --with orchestra/testbench:${{ matrix.testbench }}

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit tests
